<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOU Academy - Learning Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>LOU Academy</span>
            </div>
        </div>
        <div class="sidebar-user">
            <div class="user-avatar">JA</div>
            <div class="user-info">
                <span class="user-name">Julien Agranier</span>
                <span class="user-role">Administrateur</span>
            </div>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item active" data-page="dashboard">
                <i class="fas fa-th-large"></i>
                <span>Tableau de bord</span>
            </li>
            <li class="menu-item" data-page="catalogue">
                <i class="fas fa-book-open"></i>
                <span>Catalogue</span>
            </li>
            <li class="menu-item" data-page="mes-formations">
                <i class="fas fa-play-circle"></i>
                <span>Mes formations</span>
            </li>
            <li class="menu-item" data-page="creer-formation">
                <i class="fas fa-plus-circle"></i>
                <span>Créer une formation</span>
            </li>
            <li class="menu-item" data-page="apprenants">
                <i class="fas fa-users"></i>
                <span>Apprenants</span>
            </li>
            <li class="menu-item" data-page="rapports">
                <i class="fas fa-chart-bar"></i>
                <span>Rapports</span>
            </li>
            <li class="menu-item" data-page="certificats">
                <i class="fas fa-certificate"></i>
                <span>Certificats</span>
            </li>
            <li class="menu-item" data-page="parametres">
                <i class="fas fa-cog"></i>
                <span>Paramètres</span>
            </li>
        </ul>
        <div class="sidebar-footer">
            <button class="btn-logout" onclick="app.logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Déconnexion</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <!-- Top Bar -->
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Rechercher une formation, un apprenant..." id="global-search">
            </div>
            <div class="topbar-actions">
                <button class="notif-btn" id="notif-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge" id="notif-badge">3</span>
                </button>
                <button class="help-btn" onclick="app.showHelp()">
                    <i class="fas fa-question-circle"></i>
                </button>
            </div>
        </header>

        <!-- Notification Panel -->
        <div class="notif-panel" id="notif-panel">
            <div class="notif-header">
                <h3>Notifications</h3>
                <button onclick="app.clearNotifications()">Tout marquer comme lu</button>
            </div>
            <div class="notif-list" id="notif-list"></div>
        </div>

        <!-- Page Content -->
        <div class="page-content" id="page-content">
            <!-- Dynamic content loaded here -->
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="modal-close" onclick="app.closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toast-container"></div>

    <script src="js/data.js"></script>
    <script src="js/app-core.js"></script>
    <script src="js/app-pages.js"></script>
    <script src="js/app-pages2.js"></script>
    <script src="js/app-pages3.js"></script>
    <script src="js/app-pages4.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
